# Installed to /etc/systemd/system.conf.d/10-watchdog.conf
#
# The BCM2835 hardware watchdog tops out at 15s. systemd's default
# RebootWatchdogSec=10min is rejected ("Failed to set timeout to 600s"),
# which left reboots unprotected: a hang during a reboot on 2026-10-25
# kept the Pi dead for 9h until it was power-cycled.
[Manager]
RuntimeWatchdogSec=15
RebootWatchdogSec=15
